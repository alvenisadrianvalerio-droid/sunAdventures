    <circle cx="0" cy="0" r="40" fill="url(#purple)"/>
    <!-- Golden Paw + Crown inside -->
    <polygon points="-20,-12 -24,-28 -10,-18 0,-30 10,-18 24,-28 20,-12" fill="url(#gold)"/>
    <circle cx="-12" cy="4" r="5" fill="#FFF275"/>
    <circle cx="0" cy="-1" r="5" fill="#FFF275"/>
    <circle cx="12" cy="4" r="5" fill="#FFF275"/>
    <ellipse cx="0" cy="18" rx="12" ry="9" fill="#FFF275"/>

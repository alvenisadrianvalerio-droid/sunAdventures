<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="goldPen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
    <filter id="noteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Notebook tilted -->
  <g transform="translate(24, 20) rotate(-4)" filter="url(#noteShadow)">
    <!-- Back Cover -->
    <rect x="0" y="0" width="94" height="118" rx="10" fill="url(#coverGrad)"/>
    <!-- Paper block -->
    <rect x="14" y="6" width="76" height="106" rx="4" fill="#FFFDF2"/>
    <!-- Ruled lines -->
    <line x1="24" y1="28" x2="78" y2="28" stroke="#FFEAA7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="42" x2="78" y2="42" stroke="#FFEAA7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="56" x2="78" y2="56" stroke="#FFEAA7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="70" x2="65" y2="70" stroke="#FFEAA7" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Heart sticker on page -->
    <path d="M48 88 C48 84 53 82 56 85 C59 82 64 84 64 88 C64 93 56 97 56 97 C56 97 48 93 48 88 Z" fill="#E84393"/>
    <!-- Wire spiral binding -->
    <g fill="#636E72">
      <ellipse cx="6" cy="20" rx="7" ry="3"/>
      <ellipse cx="6" cy="38" rx="7" ry="3"/>
      <ellipse cx="6" cy="56" rx="7" ry="3"/>
      <ellipse cx="6" cy="74" rx="7" ry="3"/>
      <ellipse cx="6" cy="92" rx="7" ry="3"/>
    </g>
  </g>

  <!-- Golden Fountain Quill Feather Pen -->
  <g transform="translate(100, 42) rotate(32)" filter="url(#noteShadow)">
    <path d="M0 0 Q18 45 4 95 Q-14 45 0 0 Z" fill="url(#goldPen)"/>
    <!-- Quill Spine -->
    <line x1="0" y1="5" x2="2" y2="95" stroke="#FFFFFF" stroke-width="1.8" opacity="0.7"/>
    <!-- Nib tip -->
    <polygon points="1,95 -2,108 4,108" fill="#2D3436"/>
  </g>
</svg>

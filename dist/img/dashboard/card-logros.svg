<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A532D"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </linearGradient>
    <linearGradient id="laurelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <filter id="trophyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Guirnalda de laurel izquierda -->
  <g fill="url(#laurelGrad)" stroke="#00897B" stroke-width="1.5" stroke-linejoin="round" filter="url(#trophyShadow)">
    <path d="M40 108 C22 82 28 50 52 32" fill="none" stroke="#00B894" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="33" cy="96" rx="8" ry="4" transform="rotate(-30 33 96)"/>
    <ellipse cx="27" cy="80" rx="8" ry="4" transform="rotate(-12 27 80)"/>
    <ellipse cx="28" cy="63" rx="8" ry="4" transform="rotate(8 28 63)"/>
    <ellipse cx="35" cy="47" rx="8" ry="4" transform="rotate(28 35 47)"/>
    <ellipse cx="47" cy="35" rx="8" ry="4" transform="rotate(45 47 35)"/>
  </g>

  <!-- Guirnalda de laurel derecha -->
  <g fill="url(#laurelGrad)" stroke="#00897B" stroke-width="1.5" stroke-linejoin="round" filter="url(#trophyShadow)">
    <path d="M120 108 C138 82 132 50 108 32" fill="none" stroke="#00B894" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="127" cy="96" rx="8" ry="4" transform="rotate(30 127 96)"/>
    <ellipse cx="133" cy="80" rx="8" ry="4" transform="rotate(12 133 80)"/>
    <ellipse cx="132" cy="63" rx="8" ry="4" transform="rotate(-8 132 63)"/>
    <ellipse cx="125" cy="47" rx="8" ry="4" transform="rotate(-28 125 47)"/>
    <ellipse cx="113" cy="35" rx="8" ry="4" transform="rotate(-45 113 35)"/>
  </g>

  <!-- Copa y Pedestal -->
  <g filter="url(#trophyShadow)">
    <!-- Asas laterales -->
    <path d="M52 50 C32 50 28 84 55 88" fill="none" stroke="url(#goldCup)" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 50 C32 50 28 84 55 88" fill="none" stroke="#B76006" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M108 50 C128 50 132 84 105 88" fill="none" stroke="url(#goldCup)" stroke-width="6" stroke-linecap="round"/>
    <path d="M108 50 C128 50 132 84 105 88" fill="none" stroke="#B76006" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tallo y Base de oro -->
    <rect x="74" y="96" width="12" height="20" rx="3" fill="url(#goldCup)" stroke="#B76006" stroke-width="2"/>
    <ellipse cx="80" cy="105" rx="10" ry="3.5" fill="#FFF275" stroke="#B76006" stroke-width="1.5"/>
    <path d="M60 122 L100 122 L95 112 L65 112 Z" fill="url(#goldCup)" stroke="#B76006" stroke-width="2"/>

    <!-- Pedestal de madera noble -->
    <rect x="48" y="120" width="64" height="20" rx="5" fill="url(#pedestalGrad)" stroke="#2D1606" stroke-width="2"/>
    <rect x="42" y="136" width="76" height="8" rx="4" fill="#3E2723" stroke="#2D1606" stroke-width="2"/>
    <rect x="60" y="125" width="40" height="10" rx="2.5" fill="#FFD93D" stroke="#B76006" stroke-width="1.2"/>

    <!-- Cuerpo principal de la copa -->
    <path d="M48 38 C48 86 64 100 80 100 C96 100 112 86 112 38 Z" fill="url(#goldCup)" stroke="#B76006" stroke-width="2.5"/>
    <!-- Brillo lateral de la copa -->
    <path d="M56 46 C56 75 65 88 73 92" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Borde superior -->
    <ellipse cx="80" cy="38" rx="32" ry="8" fill="#FFF9C4" stroke="#B76006" stroke-width="2"/>
    <ellipse cx="80" cy="38" rx="27" ry="5" fill="#D35400"/>

    <!-- Estrella central en relieve -->
    <polygon points="80,52 84,61 94,62 86,68 89,78 80,72 71,78 74,68 66,62 76,61" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5"/>
    <circle cx="80" cy="66" r="3" fill="#FF7675"/>
  </g>

  <!-- Destellos mágicos -->
  <polygon points="80,10 83,17 90,20 83,23 80,30 77,23 70,20 77,17" fill="#FFF275"/>
  <polygon points="24,34 26,39 31,41 26,43 24,48 22,43 17,41 22,39" fill="#FFF275" opacity="0.85"/>
  <polygon points="136,34 138,39 143,41 138,43 136,48 134,43 129,41 134,39" fill="#FFF275" opacity="0.85"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-noche" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b102b" flood-opacity="0.8"/>
    </filter>
    <radialGradient id="sky-noche" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e2a6b"/>
      <stop offset="45%" stop-color="#0d143a"/>
      <stop offset="100%" stop-color="#050818"/>
    </radialGradient>
    <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffced"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cloudN" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.4"/>
  <g filter="url(#glow-noche)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-noche)" stroke="rgba(147,197,253,0.35)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Nebulosa sutil -->
    <path d="M22 80c20-15 45-5 65-15s35-2 47 10v41a24 24 0 0 1-24 24H46a24 24 0 0 1-24-24V80z" fill="url(#cloudN)"/>
    
    <!-- Luna brillante con cráteres suaves -->
    <circle cx="102" cy="52" r="24" fill="url(#moonG)" filter="drop-shadow(0 0 14px rgba(253,224,71,0.65))"/>
    <circle cx="112" cy="46" r="22" fill="#0e173d" opacity="0.94"/>
    
    <!-- Constelaciones y estrellas con brillos -->
    <g fill="#fff">
      <circle cx="44" cy="42" r="2.2" opacity="0.95"/>
      <circle cx="68" cy="34" r="1.5" opacity="0.8"/>
      <circle cx="56" cy="62" r="1.8" opacity="0.85"/>
      <circle cx="36" cy="74" r="1.2" opacity="0.6"/>
      <circle cx="86" cy="88" r="1.5" opacity="0.75"/>
      <circle cx="122" cy="94" r="2" opacity="0.9"/>
    </g>
    <!-- Destellos de 4 puntas -->
    <path d="M46 36l1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z" fill="#fde047" opacity="0.9"/>
    <path d="M78 48l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#93c5fd" opacity="0.8"/>
    <path d="M118 78l1.2 4 4 1.2-4 1.2-1.2 4-1.2-4-4-1.2 4-1.2z" fill="#fde047" opacity="0.85"/>
    
    <!-- Montañas en silueta en la base -->
    <path d="M18 124l26-30 28 22 34-36 36 44v16H18z" fill="#040612"/>
    <path d="M48 126l22-20 20 14 26-22 26 28H48z" fill="#0a0f26" opacity="0.7"/>
  </g>
</svg>
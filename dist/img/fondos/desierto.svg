<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-desierto" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="sky-desierto" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="45%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </radialGradient>
    <linearGradient id="sunD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="duneG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="duneG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.4"/>
  <g filter="url(#glow-desierto)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-desierto)" stroke="rgba(245,158,11,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Sol gigante en el ocaso del desierto -->
    <circle cx="80" cy="62" r="26" fill="url(#sunD)" filter="drop-shadow(0 0 16px rgba(245,158,11,0.7))"/>
    
    <!-- Polvo y calor en el horizonte -->
    <ellipse cx="80" cy="78" rx="42" ry="12" fill="#d97706" opacity="0.25" filter="blur(8px)"/>
    
    <!-- Duna lejana -->
    <path d="M18 96c34-18 64 6 92-8s26-6 32-2v40H18z" fill="#92400e" opacity="0.75"/>
    
    <!-- Duna intermedia con cresta dorada -->
    <path d="M18 108c40-16 68 12 98-4s20-6 26-2v24H18z" fill="url(#duneG1)"/>
    
    <!-- Silueta de cactus saguaro -->
    <g transform="translate(112,88)">
      <rect x="-2.5" y="0" width="5" height="24" rx="2.5" fill="#291103"/>
      <!-- Brazo izquierdo -->
      <path d="M-2.5 12h-5v-6" stroke="#291103" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Brazo derecho -->
      <path d="M2.5 8h5v-6" stroke="#291103" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Duna frontal principal iluminada -->
    <path d="M142 120c-35-18-68 8-100-8c-12-6-18-4-24 0v14a24 24 0 0 0 24 24h76a24 24 0 0 0 24-24v-6z" fill="url(#duneG2)"/>
    
    <!-- Estrellas doradas en el cielo nocturno del desierto -->
    <circle cx="36" cy="38" r="1.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="124" cy="36" r="1.8" fill="#fef08a" opacity="0.85"/>
    <path d="M48 48l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fde047" opacity="0.9"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-fuego" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="sky-fuego" cx="50%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="45%" stop-color="#2a0505"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </radialGradient>
    <linearGradient id="flameG1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameG2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.45"/>
  <g filter="url(#glow-fuego)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-fuego)" stroke="rgba(249,115,22,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Resplandor ardiente de fondo -->
    <circle cx="80" cy="94" r="38" fill="#ea580c" opacity="0.25" filter="blur(10px)"/>
    
    <!-- Llama mística principal (capa exterior) -->
    <path d="M80 34c14 18 28 32 28 48c0 16-12 28-28 28s-28-12-28-28c0-14 12-28 28-48z" fill="url(#flameG1)" filter="drop-shadow(0 0 14px rgba(245,158,11,0.6))"/>
    
    <!-- Llama interior con núcleo blanco brillante -->
    <path d="M80 50c9 12 18 20 18 32c0 10-8 18-18 18s-18-8-18-18c0-10 8-18 18-32z" fill="url(#flameG2)"/>
    
    <!-- Chispas y ascuas flotando en espiral ascendente -->
    <circle cx="56" cy="46" r="2.2" fill="#fde047" filter="drop-shadow(0 0 5px #f59e0b)"/>
    <circle cx="106" cy="42" r="2" fill="#f97316" filter="drop-shadow(0 0 4px #ea580c)"/>
    <circle cx="70" cy="28" r="1.5" fill="#fde047"/>
    <circle cx="94" cy="24" r="1.8" fill="#fef08a"/>
    <circle cx="44" cy="76" r="2.5" fill="#f97316"/>
    <circle cx="118" cy="72" r="2.2" fill="#fde047"/>
    <circle cx="80" cy="20" r="1.2" fill="#fff"/>
    
    <!-- Rocas volcánicas / obsidiana en la base -->
    <path d="M18 126l24-18 20 10 32-16 28 14 20-8v28a24 24 0 0 1-24 24H42a24 24 0 0 1-24-24v-20z" fill="#180404"/>
    <path d="M42 118l18 8 24-12 26 10" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
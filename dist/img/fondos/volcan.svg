<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-volcan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#dc2626" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="sky-volcan" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="55%" stop-color="#1f0303"/>
      <stop offset="100%" stop-color="#080101"/>
    </radialGradient>
    <linearGradient id="lavaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.45"/>
  <g filter="url(#glow-volcan)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-volcan)" stroke="rgba(239,68,68,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Humo y ceniza volcánica -->
    <path d="M72 48c-12-8-8-22 4-26c14-4 26 4 22 18c-4 12-14 16-26 8z" fill="#7f1d1d" opacity="0.35" filter="blur(6px)"/>
    
    <!-- Volcán majestuoso de basalto -->
    <polygon points="36,128 66,74 94,74 124,128" fill="#1c0707"/>
    <!-- Relieve de la montaña -->
    <polygon points="66,74 80,128 94,74" fill="#2d0c0c"/>
    <polygon points="36,128 58,100 80,128" fill="#150404"/>
    
    <!-- Cráter incandescente con erupción -->
    <ellipse cx="80" cy="74" rx="14" ry="4.5" fill="#fef08a" filter="drop-shadow(0 0 10px #f97316)"/>
    <ellipse cx="80" cy="74" rx="10" ry="3" fill="#ffffff"/>
    
    <!-- Cascadas de lava fluyendo por la ladera -->
    <path d="M74 76c-3 12-8 22-5 34c2 6 0 12-3 18" stroke="url(#lavaG)" stroke-width="3" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 6px #f97316)"/>
    <path d="M84 76c3 14 6 24 3 36c-1 5 1 10 3 16" stroke="url(#lavaG)" stroke-width="3.2" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 6px #f97316)"/>
    
    <!-- Proyección de bombas de lava y chispas en el cielo -->
    <circle cx="80" cy="46" r="3" fill="#fef08a" filter="drop-shadow(0 0 6px #f97316)"/>
    <circle cx="68" cy="38" r="2.2" fill="#f97316"/>
    <circle cx="94" cy="42" r="2.5" fill="#f97316"/>
    <circle cx="60" cy="56" r="1.8" fill="#ef4444"/>
    <circle cx="104" cy="54" r="2" fill="#ef4444"/>
    <circle cx="80" cy="28" r="1.5" fill="#fff"/>
    
    <!-- Suelo y ríos de magma en la base -->
    <path d="M18 132c30-4 70-4 124 0v8a24 24 0 0 1-24 24H42a24 24 0 0 1-24-24v-8z" fill="#0c0202"/>
  </g>
</svg>
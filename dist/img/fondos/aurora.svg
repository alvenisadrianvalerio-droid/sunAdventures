<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-aurora" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#021c17" flood-opacity="0.8"/>
    </filter>
    <radialGradient id="sky-aurora" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#062e2d"/>
      <stop offset="55%" stop-color="#031620"/>
      <stop offset="100%" stop-color="#010810"/>
    </radialGradient>
    <linearGradient id="auroraG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="auroraG2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.4"/>
  <g filter="url(#glow-aurora)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-aurora)" stroke="rgba(110,231,183,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Estrellas de fondo -->
    <circle cx="36" cy="38" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="68" cy="30" r="1.2" fill="#fff" opacity="0.75"/>
    <circle cx="114" cy="40" r="1.8" fill="#fff" opacity="0.9"/>
    <circle cx="128" cy="62" r="1.2" fill="#fff" opacity="0.65"/>
    
    <!-- Olas luminosas de Aurora boreal -->
    <path d="M18 52c22-16 46 8 68-6s36-8 56 12v35c-24-14-48 6-72-4s-38-6-52 8V52z" fill="url(#auroraG1)" filter="drop-shadow(0 0 12px rgba(52,211,153,0.7))"/>
    <path d="M18 68c26-14 50 12 74-2s34-4 50 16v24c-20-12-42 6-64-2s-40-6-60 6V68z" fill="url(#auroraG2)" filter="drop-shadow(0 0 10px rgba(56,189,248,0.6))"/>
    
    <!-- Resplandor estelar en el cielo -->
    <path d="M96 32l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#a7f3d0" opacity="0.95"/>
    <path d="M48 48l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#67e8f9" opacity="0.85"/>
    
    <!-- Montañas nevadas árticas -->
    <path d="M18 126l28-36 24 20 32-34 40 50H18z" fill="#04121a"/>
    <path d="M46 90l8 12-8-4-8 12 8-20z" fill="#cffafe" opacity="0.9"/>
    <path d="M102 76l10 16-10-5-10 15 10-26z" fill="#cffafe" opacity="0.95"/>
    
    <!-- Pinos árticos en silueta -->
    <polygon points="32,126 36,112 40,126" fill="#02080d"/>
    <polygon points="33,126 36,116 39,126" fill="#02080d"/>
    <polygon points="120,126 124,108 128,126" fill="#02080d"/>
    <polygon points="126,126 129,114 132,126" fill="#02080d"/>
  </g>
</svg>
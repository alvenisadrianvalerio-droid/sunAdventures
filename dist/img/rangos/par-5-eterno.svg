    <filter id="sh" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g transform="translate(80, 88)" filter="url(#sh)">
    <!-- Diamond Crown on top of Ring -->
    <polygon points="-22,-34 22,-34 32,-18 0,4 -32,-18" fill="url(#sky)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Golden Wedding Ring -->
    <circle cx="0" cy="14" r="34" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="0" cy="14" r="34" fill="none" stroke="#FFF275" stroke-width="3" opacity="0.6"/>
    <!-- Heart inside Ring -->
    <path d="M-14 10 C-14 2 -4 0 0 6 C4 0 14 2 14 10 C14 20 0 28 0 28 C0 28 -14 20 -14 10 Z" fill="url(#pink)"/>
  </g>
  <polygon points="80,8 84,16 92,20 84,24 80,32 76,24 68,20 76,16" fill="#FFF275"/>
  <polygon points="26,30 29,37 36,40 29,43 26,50 23,43 16,40 23,37" fill="#FFF275"/>
  <polygon points="134,30 137,37 144,40 137,43 134,50 131,43 124,40 131,37" fill="#FFF275"/>

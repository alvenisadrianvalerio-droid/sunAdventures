<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB8B8"/>
      <stop offset="50%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD79A8"/>
      <stop offset="100%" stop-color="#E84393"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81ECEC"/>
      <stop offset="50%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE"/>
      <stop offset="50%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#341F97"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DFE6E9"/>
      <stop offset="100%" stop-color="#636E72"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>
    <filter id="sh" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g transform="translate(80, 88)" filter="url(#sh)">
    <!-- Gift Boxes sticking out -->
    <rect x="-32" y="-52" width="32" height="32" rx="4" fill="url(#sky)" stroke="#0984E3" stroke-width="2" transform="rotate(-10 -16 -36)"/>
    <rect x="2" y="-56" width="34" height="36" rx="4" fill="url(#coral)" stroke="#B71540" stroke-width="2" transform="rotate(8 18 -38)"/>
    <!-- Wicker Basket -->
    <polygon points="-50,-22 50,-22 38,38 -38,38" fill="url(#wood)" stroke="#B76006" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-54" y="-28" width="108" height="12" rx="6" fill="url(#gold)" stroke="#B76006" stroke-width="2"/>
    <line x1="-30" y1="-16" x2="-24" y2="38" stroke="#B76006" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-16" x2="0" y2="38" stroke="#B76006" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-16" x2="24" y2="38" stroke="#B76006" stroke-width="2" opacity="0.5"/>
  </g>
  <polygon points="134,26 137,33 144,36 137,39 134,46 131,39 124,36 131,33" fill="#FFF275"/>

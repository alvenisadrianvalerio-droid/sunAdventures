    <filter id="sh" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g transform="translate(80, 86)" filter="url(#sh)">
    <!-- Red Plume -->
    <path d="M0 -62 C26 -62 38 -36 18 -22 H-18 C-38 -36 -26 -62 0 -62 Z" fill="url(#coral)" stroke="#B71540" stroke-width="2"/>
    <!-- Knight Helmet -->
    <path d="M-38 -10 C-38 -42 38 -42 38 -10 V34 L0 48 L-38 34 Z" fill="url(#steel)" stroke="#2D3436" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Visor & Gold Trim -->
    <polygon points="-28,-4 0,8 28,-4 24,14 0,24 -24,14" fill="#181926"/>
    <line x1="0" y1="-34" x2="0" y2="46" stroke="url(#gold)" stroke-width="5"/>

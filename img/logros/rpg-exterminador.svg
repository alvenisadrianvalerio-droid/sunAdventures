    <filter id="sh" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g transform="translate(80, 82)" filter="url(#sh)">
    <!-- Crimson Shield -->
    <path d="M0 -44 L38 -28 V6 C38 32 0 50 0 50 C0 50 -38 32 -38 6 V-28 Z" fill="url(#coral)" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- Crossed Twin Swords -->
    <g rotate="-42" transform="rotate(-42)">
      <polygon points="0,-64 8,-50 6,30 -6,30 -8,-50" fill="url(#steel)" stroke="#2D3436" stroke-width="1.5"/>
      <rect x="-18" y="30" width="36" height="8" rx="3" fill="url(#gold)"/>
    </g>
    <g transform="rotate(42)">
      <polygon points="0,-64 8,-50 6,30 -6,30 -8,-50" fill="url(#steel)" stroke="#2D3436" stroke-width="1.5"/>
      <rect x="-18" y="30" width="36" height="8" rx="3" fill="url(#gold)"/>
    </g>
  </g>
  <polygon points="80,12 84,20 92,24 84,28 80,36 76,28 68,24 76,20" fill="#FFF275"/>

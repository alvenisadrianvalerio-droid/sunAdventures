<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-galaxia" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="sky-galaxia" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#18022e"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <radialGradient id="planetG" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e0108"/>
    </radialGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.45"/>
  <g filter="url(#glow-galaxia)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-galaxia)" stroke="rgba(192,132,252,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Polvo cósmico / Nebulosa -->
    <path d="M22 45c30-10 60 20 85 5s25-10 33 15v45c-20 15-50-5-75 10s-35 5-43-15V45z" fill="#9333ea" opacity="0.2" filter="blur(8px)"/>
    
    <!-- Campo estelar -->
    <circle cx="34" cy="38" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="58" cy="28" r="1.2" fill="#e0e7ff" opacity="0.8"/>
    <circle cx="122" cy="34" r="1.6" fill="#fff" opacity="0.85"/>
    <circle cx="132" cy="78" r="1.2" fill="#bae6fd" opacity="0.75"/>
    <circle cx="42" cy="114" r="1.8" fill="#fff" opacity="0.9"/>
    <circle cx="118" cy="120" r="1.4" fill="#fbcfe8" opacity="0.8"/>
    
    <!-- Anillo trasero de Saturno cósmico -->
    <g transform="translate(80,78) rotate(-24)">
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="url(#ringG)" stroke-width="5" opacity="0.8" stroke-dasharray="80 180"/>
      <!-- Sombra interna del anillo -->
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>
    </g>
    
    <!-- Planeta central con atmósfera -->
    <circle cx="80" cy="78" r="26" fill="url(#planetG)" filter="drop-shadow(0 0 16px rgba(244,63,94,0.45))"/>
    
    <!-- Textura de bandas en el planeta -->
    <path d="M57 74c8-3 38-3 46 0" stroke="rgba(254,215,170,0.35)" stroke-width="2.5" fill="none"/>
    <path d="M55 81c10-2 40-2 50 0" stroke="rgba(251,113,133,0.3)" stroke-width="3" fill="none"/>
    
    <!-- Anillo frontal de Saturno cósmico -->
    <g transform="translate(80,78) rotate(-24)">
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="url(#ringG)" stroke-width="5" stroke-dasharray="160 140"/>
    </g>
    
    <!-- Estrellas brillantes de 4 puntas -->
    <path d="M48 52l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#fde047" opacity="0.95"/>
    <path d="M112 102l1.2 3.5 3.5 1.2-3.5 1.2-1.2 3.5-1.2-3.5-3.5-1.2 3.5-1.2z" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
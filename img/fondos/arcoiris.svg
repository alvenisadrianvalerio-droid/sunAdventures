<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-arcoiris" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="sky-arcoiris" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
    <linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.2"/>
  <g filter="url(#glow-arcoiris)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-arcoiris)" stroke="rgba(244,114,182,0.4)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
    
    <!-- Arcoíris pastel concéntrico elegante -->
    <g transform="translate(80,82)">
      <path d="M-44 14a44 44 0 0 1 88 0" stroke="#f472b6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M-38 14a38 38 0 0 1 76 0" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M-32 14a32 32 0 0 1 64 0" stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M-26 14a26 26 0 0 1 52 0" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M-20 14a20 20 0 0 1 40 0" stroke="#c084fc" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
    </g>
    
    <!-- Nubes esponjosas en las bases del arcoíris -->
    <!-- Nube izquierda -->
    <g transform="translate(42,94)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.08))">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#cloudG)"/>
      <circle cx="-8" cy="-6" r="10" fill="url(#cloudG)"/>
      <circle cx="8" cy="-4" r="9" fill="url(#cloudG)"/>
    </g>
    <!-- Nube derecha -->
    <g transform="translate(118,94)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.08))">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#cloudG)"/>
      <circle cx="-6" cy="-5" r="9" fill="url(#cloudG)"/>
      <circle cx="7" cy="-6" r="10" fill="url(#cloudG)"/>
    </g>
    
    <!-- Destellos dorados y estrellas mágicas -->
    <path d="M80 34l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#f59e0b" filter="drop-shadow(0 0 6px rgba(245,158,11,0.6))"/>
    <path d="M48 48l1.2 3.5 3.5 1.2-3.5 1.2-1.2 3.5-1.2-3.5-3.5-1.2 3.5-1.2z" fill="#ec4899" opacity="0.85"/>
    <path d="M112 46l1.2 3.5 3.5 1.2-3.5 1.2-1.2 3.5-1.2-3.5-3.5-1.2 3.5-1.2z" fill="#38bdf8" opacity="0.85"/>
    <circle cx="34" cy="72" r="2" fill="#fbbf24" opacity="0.9"/>
    <circle cx="126" cy="68" r="2.2" fill="#f472b6" opacity="0.9"/>
  </g>
</svg>
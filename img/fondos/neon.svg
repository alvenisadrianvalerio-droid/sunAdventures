<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="sky-neon" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e0024"/>
      <stop offset="50%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#020005"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.45"/>
  <g filter="url(#glow-neon)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-neon)" stroke="rgba(236,72,153,0.45)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(0,255,255,0.25)" stroke-width="1"/>
    
    <!-- Resplandor volumétrico central -->
    <circle cx="80" cy="78" r="34" fill="#a21caf" opacity="0.25" filter="blur(16px)"/>
    
    <!-- Figuras geométricas isométricas neón (Cubo / Hexágono brillante) -->
    <!-- Diamante cian resplandeciente exterior -->
    <polygon points="80,38 116,78 80,118 44,78" stroke="#00fff0" stroke-width="4.5" stroke-linejoin="round" fill="none" filter="drop-shadow(0 0 10px #00fff0)"/>
    
    <!-- Círculo magenta interior con brillo intenso -->
    <circle cx="80" cy="78" r="22" stroke="#ff007f" stroke-width="4.5" fill="rgba(255,0,127,0.12)" filter="drop-shadow(0 0 12px #ff007f)"/>
    
    <!-- Núcleo con rayo neón amarillo -->
    <polygon points="82,60 70,78 80,78 76,96 90,74 80,74" fill="#ffde59" filter="drop-shadow(0 0 8px #ffde59)"/>
    
    <!-- Rayos de luz neón cruzados -->
    <line x1="28" y1="26" x2="48" y2="46" stroke="#00fff0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="132" y1="26" x2="112" y2="46" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="130" x2="48" y2="110" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="132" y1="130" x2="112" y2="110" stroke="#00fff0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Puntos y destellos de neón -->
    <circle cx="80" cy="38" r="3" fill="#fff" filter="drop-shadow(0 0 6px #00fff0)"/>
    <circle cx="80" cy="118" r="3" fill="#fff" filter="drop-shadow(0 0 6px #00fff0)"/>
    <circle cx="44" cy="78" r="3" fill="#fff" filter="drop-shadow(0 0 6px #00fff0)"/>
    <circle cx="116" cy="78" r="3" fill="#fff" filter="drop-shadow(0 0 6px #00fff0)"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-oceano" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="sky-oceano" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="75%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="rayoOceano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.4"/>
  <g filter="url(#glow-oceano)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-oceano)" stroke="rgba(56,189,248,0.45)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Rayos de luz submarina desde la superficie -->
    <polygon points="50,16 65,16 95,95 75,95" fill="url(#rayoOceano)"/>
    <polygon points="80,16 92,16 120,90 105,90" fill="url(#rayoOceano)"/>
    
    <!-- Medusa bioluminiscente etérea -->
    <g transform="translate(68,54)">
      <!-- Sombrero de medusa -->
      <path d="M-14 4c0-12 28-12 28 0c0 4-6 6-14 6s-14-2-14-6z" fill="#38bdf8" opacity="0.85" filter="drop-shadow(0 0 10px rgba(56,189,248,0.8))"/>
      <path d="M-10 4c0-8 20-8 20 0" fill="#e0f2fe" opacity="0.6"/>
      <!-- Tentáculos fluidos -->
      <path d="M-8 10c-2 6 2 12-1 18" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M-3 10c0 8 4 14 1 22" stroke="#a5f3fc" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M3 10c2 7-2 14 2 22" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M8 10c3 6-1 12 2 18" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>
    
    <!-- Pequeña medusa secundaria -->
    <g transform="translate(108,44) scale(0.65)">
      <path d="M-14 4c0-12 28-12 28 0c0 4-6 6-14 6s-14-2-14-6z" fill="#f472b6" opacity="0.85" filter="drop-shadow(0 0 8px rgba(244,114,182,0.8))"/>
      <path d="M-4 10c-1 6 2 12 0 18" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M4 10c2 6-2 12 1 18" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Burbujas ascendentes translúcidas -->
    <circle cx="42" cy="78" r="3.5" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.85"/>
    <circle cx="43" cy="77" r="1" fill="#fff" opacity="0.9"/>
    
    <circle cx="48" cy="52" r="2.2" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.75"/>
    <circle cx="94" cy="92" r="4.2" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.85"/>
    <circle cx="95" cy="91" r="1.2" fill="#fff" opacity="0.9"/>
    
    <circle cx="118" cy="74" r="2.5" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.8"/>
    
    <!-- Arrecife y corales en el fondo abisal -->
    <path d="M18 132c25-10 40 4 62-6s38 8 62-2v16H18z" fill="#041a2f"/>
    <!-- Corales y algas -->
    <path d="M32 134c-4-10 6-16 2-24" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M28 126c6-4 8-10 6-16" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M124 134c4-12-4-18-1-26" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M128 124c-6-4-6-12-3-18" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB8B8"/>
      <stop offset="50%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#E84393"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="60%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <filter id="pigShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Piggy Bank body -->
  <g transform="translate(74, 92)" filter="url(#pigShadow)">
    <!-- Back legs -->
    <rect x="-38" y="22" width="14" height="18" rx="7" fill="#C0392B"/>
    <rect x="22" y="22" width="14" height="18" rx="7" fill="#C0392B"/>

    <!-- Main Oval Body -->
    <ellipse cx="0" cy="0" rx="48" ry="36" fill="url(#pigGrad)" stroke="#D63031" stroke-width="2.5"/>

    <!-- Front legs -->
    <rect x="-30" y="22" width="14" height="20" rx="7" fill="#FF7675" stroke="#D63031" stroke-width="1.8"/>
    <rect x="14" y="22" width="14" height="20" rx="7" fill="#FF7675" stroke="#D63031" stroke-width="1.8"/>

    <!-- Cute Snout -->
    <ellipse cx="44" cy="2" rx="14" ry="11" fill="#FF7675" stroke="#D63031" stroke-width="2"/>
    <circle cx="41" cy="2" r="2.5" fill="#6D214F"/>
    <circle cx="48" cy="2" r="2.5" fill="#6D214F"/>

    <!-- Ear -->
    <polygon points="18,-24 30,-38 32,-18" fill="#D63031" stroke="#B71540" stroke-width="1.5"/>
    <polygon points="20,-22 28,-34 30,-18" fill="#FFB8B8"/>

    <!-- Eye -->
    <circle cx="28" cy="-8" r="3.5" fill="#2C3E50"/>
    <circle cx="29" cy="-9" r="1.2" fill="#FFFFFF"/>

    <!-- Tail spiral -->
    <path d="M-46 6 C-52 6 -54 -2 -50 -4 C-46 -6 -48 -12 -52 -10" fill="none" stroke="#D63031" stroke-width="3" stroke-linecap="round"/>

    <!-- Coin Slot on top -->
    <ellipse cx="-6" cy="-34" rx="16" ry="4" fill="#2C3E50"/>
  </g>

  <!-- SunCoin dropping into slot -->
  <g transform="translate(68, 42)" filter="url(#pigShadow)">
    <circle cx="0" cy="0" r="19" fill="url(#coinGold)" stroke="#D35400" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    <!-- Sunflower Sun Stamp on Coin -->
    <circle cx="0" cy="0" r="5" fill="#8B4513"/>
    <circle cx="0" cy="-7" r="1.8" fill="#FFF275"/>
    <circle cx="0" cy="7" r="1.8" fill="#FFF275"/>
    <circle cx="-7" cy="0" r="1.8" fill="#FFF275"/>
    <circle cx="7" cy="0" r="1.8" fill="#FFF275"/>
  </g>

  <!-- Sparkles -->
  <polygon points="126,60 128,64 133,65 129,67 130,71 126,68 123,71 124,67 120,65 124,64" fill="#FFF275"/>
  <polygon points="26,62 28,66 32,67 29,69 30,73 26,70 23,73 24,69 21,67 25,66" fill="#FFF275" opacity="0.8"/>
</svg>

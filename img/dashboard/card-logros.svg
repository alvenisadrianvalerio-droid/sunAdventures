<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLogros" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fef5e4"/>
    </linearGradient>
    <linearGradient id="goldCup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe676"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c97b10"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a532d"/>
      <stop offset="100%" stop-color="#5a3318"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a3318" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Fondo artesanal con bordes suaves -->
  <rect width="400" height="320" rx="24" fill="url(#bgLogros)"/>
  <rect x="12" y="12" width="376" height="296" rx="18" fill="none" stroke="#f0dcb5" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Halo de resplandor sutil -->
  <circle cx="200" cy="140" r="95" fill="#fdf0be" opacity="0.55"/>

  <!-- Guirnalda de laurel izquierda -->
  <g fill="#7cb342" stroke="#558b2f" stroke-width="1.5" stroke-linejoin="round">
    <path d="M125 180 C110 140 120 100 150 75" fill="none" stroke="#558b2f" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="120" cy="165" rx="10" ry="5" transform="rotate(-30 120 165)"/>
    <ellipse cx="112" cy="145" rx="10" ry="5" transform="rotate(-15 112 145)"/>
    <ellipse cx="113" cy="122" rx="10" ry="5" transform="rotate(5 113 122)"/>
    <ellipse cx="123" cy="100" rx="10" ry="5" transform="rotate(25 123 100)"/>
    <ellipse cx="140" cy="83" rx="10" ry="5" transform="rotate(45 140 83)"/>
  </g>

  <!-- Guirnalda de laurel derecha -->
  <g fill="#7cb342" stroke="#558b2f" stroke-width="1.5" stroke-linejoin="round">
    <path d="M275 180 C290 140 280 100 250 75" fill="none" stroke="#558b2f" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="280" cy="165" rx="10" ry="5" transform="rotate(30 280 165)"/>
    <ellipse cx="288" cy="145" rx="10" ry="5" transform="rotate(15 288 145)"/>
    <ellipse cx="287" cy="122" rx="10" ry="5" transform="rotate(-5 287 122)"/>
    <ellipse cx="277" cy="100" rx="10" ry="5" transform="rotate(-25 277 100)"/>
    <ellipse cx="260" cy="83" rx="10" ry="5" transform="rotate(-45 260 83)"/>
  </g>

  <!-- Pedestal de madera -->
  <g filter="url(#softShadow)">
    <rect x="145" y="222" width="110" height="42" rx="8" fill="url(#pedestalGrad)" stroke="#3e210e" stroke-width="2.5"/>
    <rect x="135" y="258" width="130" height="18" rx="6" fill="#4d2b15" stroke="#3e210e" stroke-width="2.5"/>
    <!-- Placa dorada en el pedestal -->
    <rect x="160" y="232" width="80" height="22" rx="4" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
    <text x="200" y="247" font-family="'Quicksand', 'Nunito', sans-serif" font-size="11" font-weight="800" fill="#6d4508" text-anchor="middle" letter-spacing="1">LOGROS</text>
  </g>

  <!-- Copa de Oro -->
  <g filter="url(#softShadow)">
    <!-- Base de la copa -->
    <path d="M175 222 L225 222 L220 205 L180 205 Z" fill="url(#goldCup)" stroke="#8c5103" stroke-width="2.5"/>
    <!-- Tallo de la copa -->
    <rect x="193" y="178" width="14" height="28" rx="4" fill="url(#goldCup)" stroke="#8c5103" stroke-width="2.5"/>
    <!-- Anillo del tallo -->
    <ellipse cx="200" cy="190" rx="12" ry="4" fill="#ffeaa7" stroke="#8c5103" stroke-width="1.5"/>

    <!-- Asas laterales -->
    <path d="M152 110 C125 110 120 155 156 160 C154 150 152 140 152 135" fill="none" stroke="url(#goldCup)" stroke-width="7" stroke-linecap="round"/>
    <path d="M152 110 C125 110 120 155 156 160" fill="none" stroke="#8c5103" stroke-width="2" stroke-linecap="round"/>

    <path d="M248 110 C275 110 280 155 244 160 C246 150 248 140 248 135" fill="none" stroke="url(#goldCup)" stroke-width="7" stroke-linecap="round"/>
    <path d="M248 110 C275 110 280 155 244 160" fill="none" stroke="#8c5103" stroke-width="2" stroke-linecap="round"/>

    <!-- Copa cuerpo principal -->
    <path d="M150 90 C150 158 175 180 200 180 C225 180 250 158 250 90 Z" fill="url(#goldCup)" stroke="#8c5103" stroke-width="3"/>
    <!-- Borde superior de la copa -->
    <ellipse cx="200" cy="90" rx="50" ry="12" fill="#fff194" stroke="#8c5103" stroke-width="2.5"/>
    <ellipse cx="200" cy="90" rx="44" ry="8" fill="#e69500"/>

    <!-- Estrella brillante en la copa (Four Sunflowers Star) -->
    <path d="M200 115 L204 126 L216 127 L207 135 L210 146 L200 140 L190 146 L193 135 L184 127 L196 126 Z" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
    <circle cx="200" cy="133" r="3" fill="#ff9f43"/>
  </g>

  <!-- Destellos y chispitas doradas -->
  <g fill="#f5a623">
    <!-- Destello sup izq -->
    <path d="M140 60 Q140 70 130 70 Q140 70 140 80 Q140 70 150 70 Q140 70 140 60 Z"/>
    <!-- Destello sup der -->
    <path d="M260 55 Q260 65 250 65 Q260 65 260 75 Q260 65 270 65 Q260 65 260 55 Z"/>
    <!-- Destello centro arriba -->
    <path d="M200 45 Q200 55 190 55 Q200 55 200 65 Q200 55 210 55 Q200 55 200 45 Z" fill="#ffd152"/>
  </g>
</svg>

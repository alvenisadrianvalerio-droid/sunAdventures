<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2810"/>
      <stop offset="50%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81ECEC"/>
      <stop offset="60%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Big Open Tome -->
  <g transform="translate(80, 88)" filter="url(#bookShadow)">
    <!-- Back leather cover wings -->
    <path d="M-62 16 C-40 22 -10 20 0 26 C10 20 40 22 62 16 L66 -28 C40 -20 10 -22 0 -16 C-10 -22 -40 -20 -66 -28 Z" fill="url(#leatherGrad)"/>
    
    <!-- Left open page -->
    <path d="M-58 12 C-38 18 -10 16 0 20 L0 -24 C-10 -28 -38 -26 -58 -32 Z" fill="#FFFDF2" stroke="#E0D7C6" stroke-width="1.5"/>
    <!-- Left page text lines -->
    <line x1="-48" y1="-20" x2="-12" y2="-18" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <line x1="-48" y1="-10" x2="-12" y2="-8" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <line x1="-48" y1="0" x2="-18" y2="2" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <!-- Bookmark ribbon -->
    <path d="M0 -22 Q-6 0 -12 28 L-18 24 L-22 30 Q-10 0 0 -22 Z" fill="#E84393"/>

    <!-- Right open page -->
    <path d="M58 12 C38 18 10 16 0 20 L0 -24 C10 -28 38 -26 58 -32 Z" fill="#FFFDF2" stroke="#E0D7C6" stroke-width="1.5"/>
    <!-- Right page text lines & magic illustration -->
    <line x1="12" y1="-20" x2="48" y2="-18" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="-10" x2="48" y2="-8" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="38" y2="2" stroke="#D1C4B2" stroke-width="2" stroke-linecap="round"/>
    <!-- Heart glyph on right page -->
    <path d="M26 -3 C26 -6 30 -7 32 -5 C34 -7 38 -6 38 -3 C38 1 32 4 32 4 C32 4 26 1 26 -3 Z" fill="#FF7675"/>
  </g>

  <!-- Brass Magnifying Glass floating above book -->
  <g transform="translate(104, 62) rotate(24)" filter="url(#bookShadow)">
    <!-- Lens Rim & Glass -->
    <circle cx="0" cy="0" r="22" fill="url(#glassGrad)" opacity="0.75" stroke="#F1C40F" stroke-width="3.5"/>
    <ellipse cx="-6" cy="-6" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 -6 -6)"/>
    <!-- Wooden / Brass handle -->
    <rect x="-3.5" y="22" width="7" height="32" rx="3.5" fill="#8B4513" stroke="#F1C40F" stroke-width="1.5"/>
    <circle cx="0" cy="54" r="5" fill="#F1C40F"/>
  </g>
</svg>

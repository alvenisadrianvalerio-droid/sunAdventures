<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#080612" flood-opacity="0.48"/>
    </filter>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="50%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#E08E00"/>
    </linearGradient>
    <linearGradient id="bg_claro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="40%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="144" rx="46" ry="8" fill="#000" opacity="0.32"/>
  <g filter="url(#sh)">
    <rect x="26" y="26" width="108" height="104" rx="24" fill="url(#bg_claro)" stroke="#F59E0B" stroke-width="3.5"/>
    <!-- Sol cálido y luminoso con rayos -->
    <g transform="translate(80,78)">
      <!-- Rayos del sol -->
      <line x1="0" y1="-26" x2="0" y2="-32" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="32" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-26" y1="0" x2="-32" y2="0" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="32" y2="0" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-18" y1="-18" x2="-23" y2="-23" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="23" y2="-23" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-18" y1="18" x2="-23" y2="23" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="18" x2="23" y2="23" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Cuerpo del sol -->
      <circle cx="0" cy="0" r="18" fill="url(#sunGlow)"/>

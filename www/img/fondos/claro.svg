  <path d="M28 34l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FFF3A8" opacity="0.9"/>
  <path d="M132 28l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z" fill="#FFD93D" opacity="0.85"/>
  <circle cx="128" cy="122" r="3" fill="#FFF3A8" opacity="0.8"/>

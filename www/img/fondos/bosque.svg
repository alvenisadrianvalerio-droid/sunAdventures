<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-bosque" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="sky-bosque" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#02140a"/>
    </radialGradient>
    <radialGradient id="sunRay" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#86efac" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.4"/>
  <g filter="url(#glow-bosque)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-bosque)" stroke="rgba(74,222,128,0.35)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Rayos de luz matutina que atraviesan la copa -->
    <polygon points="55,16 75,16 110,110 85,110" fill="url(#sunRay)"/>
    <polygon points="85,16 98,16 130,95 115,95" fill="url(#sunRay)"/>
    
    <!-- Árboles lejanos / niebla del bosque -->
    <path d="M18 100l22-26 18 18 24-28 26 24 22-22 12 16v38H18z" fill="#064e3b" opacity="0.6"/>
    
    <!-- Pinos principales con copas estratificadas -->
    <!-- Pino izquierdo grande -->
    <g transform="translate(48,62)">
      <!-- Tronco -->
      <rect x="-4" y="32" width="8" height="24" rx="3" fill="#3f2314"/>
      <!-- Capas de follaje -->
      <polygon points="0,0 -20,16 20,16" fill="#22c55e"/>
      <polygon points="0,10 -24,26 24,26" fill="#16a34a"/>
      <polygon points="0,20 -28,38 28,38" fill="#15803d"/>
    </g>
    
    <!-- Pino derecho medio -->
    <g transform="translate(104,70)">
      <rect x="-3" y="28" width="6" height="20" rx="2" fill="#3f2314"/>
      <polygon points="0,0 -16,14 16,14" fill="#4ade80"/>
      <polygon points="0,8 -20,22 20,22" fill="#22c55e"/>
      <polygon points="0,16 -24,32 24,32" fill="#16a34a"/>
    </g>
    
    <!-- Luces de luciérnagas mágicas flotando -->
    <circle cx="34" cy="74" r="2.5" fill="#fde047" filter="drop-shadow(0 0 6px rgba(253,224,71,0.9))"/>
    <circle cx="78" cy="68" r="2" fill="#fde047" filter="drop-shadow(0 0 5px rgba(253,224,71,0.9))"/>
    <circle cx="92" cy="84" r="2.8" fill="#a7f3d0" filter="drop-shadow(0 0 6px rgba(167,243,208,0.9))"/>
    <circle cx="124" cy="62" r="1.8" fill="#fde047" filter="drop-shadow(0 0 5px rgba(253,224,71,0.8))"/>
    <circle cx="62" cy="98" r="2.2" fill="#fde047" filter="drop-shadow(0 0 6px rgba(253,224,71,0.9))"/>
    
    <!-- Colinas de musgo suave en primer plano -->
    <path d="M18 128c28-12 55 4 82-8s30 8 42 4v16a24 24 0 0 1-24 24H42a24 24 0 0 1-24-24v-12z" fill="#031f13"/>
    <path d="M48 132c18-6 38 6 60-4" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>
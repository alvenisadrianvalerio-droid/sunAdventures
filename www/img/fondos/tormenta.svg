<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="glow-tormenta" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="sky-tormenta" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cloudT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boltG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="148" rx="52" ry="7" fill="#000" opacity="0.45"/>
  <g filter="url(#glow-tormenta)">
    <!-- Base de la postal -->
    <rect x="18" y="16" width="124" height="124" rx="28" fill="url(#sky-tormenta)" stroke="rgba(148,163,184,0.35)" stroke-width="2"/>
    <rect x="22" y="20" width="116" height="116" rx="24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Resplandor de relámpago de fondo -->
    <circle cx="80" cy="72" r="32" fill="#38bdf8" opacity="0.18" filter="blur(14px)"/>
    
    <!-- Rayo principal potente y estilizado -->
    <path d="M88 38l-18 28h14l-16 38l32-42H86l14-24z" fill="url(#boltG)" filter="drop-shadow(0 0 12px #38bdf8) drop-shadow(0 0 4px #fff)"/>
    <path d="M86 42l-14 24h10l-12 30l24-34h-10l10-20z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Ramificaciones pequeñas de electricidad -->
    <path d="M72 84l-14 12" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M88 64l12 10" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Nubes tormentosas pesadas -->
    <g transform="translate(80,50)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))">
      <path d="M-44 6c0-12 16-18 28-10c8-14 26-14 34 0c14-6 28 4 26 18c6 6 2 16-6 18H-38c-8 0-12-10-6-18z" fill="url(#cloudT)"/>
    </g>
    
    <!-- Líneas de lluvia intensa diagonal -->
    <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0.65">
      <line x1="38" y1="88" x2="32" y2="104"/>
      <line x1="56" y1="94" x2="50" y2="110"/>
      <line x1="72" y1="108" x2="66" y2="124"/>
      <line x1="94" y1="92" x2="88" y2="108"/>
      <line x1="112" y1="98" x2="106" y2="114"/>
      <line x1="126" y1="84" x2="120" y2="100"/>
    </g>
    
    <!-- Mar embravecido en la noche -->
    <path d="M18 126c18-6 32 4 48-2s30-8 44-2s20 6 32 0v18a24 24 0 0 1-24 24H42a24 24 0 0 1-24-24v-14z" fill="#020617"/>
    <path d="M18 128c16-4 30 4 46-2s28-6 42 0" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
</svg>
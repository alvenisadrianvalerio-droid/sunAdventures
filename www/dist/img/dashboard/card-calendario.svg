<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE5253"/>
      <stop offset="100%" stop-color="#B71540"/>
    </linearGradient>
    <linearGradient id="calPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F2F6"/>
    </linearGradient>
    <filter id="calShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Calendar Page tilted -->
  <g transform="translate(30, 24) rotate(-3)" filter="url(#calShadow)">
    <!-- Back page edge for depth -->
    <rect x="4" y="4" width="96" height="108" rx="10" fill="#DFE4EA"/>
    <!-- Main page -->
    <rect x="0" y="0" width="96" height="108" rx="10" fill="url(#calPaper)" stroke="#CED6E0" stroke-width="1.5"/>

    <!-- Red Header Bar -->
    <path d="M0 10 C0 4.5 4.5 0 10 0 H86 C91.5 0 96 4.5 96 10 V32 H0 Z" fill="url(#calHeader)"/>

    <!-- Hanging Rings -->
    <g fill="#A4B0BE">
      <rect x="18" y="-6" width="6" height="12" rx="3" stroke="#2F3542" stroke-width="1"/>
      <rect x="72" y="-6" width="6" height="12" rx="3" stroke="#2F3542" stroke-width="1"/>
    </g>

    <!-- Header dots / month label line -->
    <rect x="34" y="12" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>

    <!-- Big Center Date (Heart Number 14 / Amor) -->
    <text x="48" y="74" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#2F3542" text-anchor="middle">14</text>

    <!-- Star / Heart Stamp circled around the day -->
    <circle cx="48" cy="65" r="26" fill="none" stroke="#FF7675" stroke-width="3" stroke-dasharray="6,4" transform="rotate(-10 48 65)"/>

    <!-- Mini cute heart badge -->
    <path d="M68 84 C68 81 72 79 74.5 81.5 C77 79 81 81 81 84 C81 88 74.5 92 74.5 92 C74.5 92 68 88 68 84 Z" fill="#E84393"/>

    <!-- Mini grid dots representing days of week -->
    <g fill="#CED6E0">
      <circle cx="20" cy="94" r="2.5"/>
      <circle cx="34" cy="94" r="2.5"/>
      <circle cx="48" cy="94" r="2.5"/>
      <circle cx="62" cy="94" r="2.5"/>
      <circle cx="76" cy="94" r="2.5"/>
    </g>
  </g>

  <!-- Golden Sun Sparkle -->
  <polygon points="126,24 130,32 138,36 130,40 126,48 122,40 114,36 122,32" fill="#FFF275"/>
</svg>

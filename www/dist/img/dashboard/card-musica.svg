<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#2D3436"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>
    <filter id="musicShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Golden Album Sleeve Peeking -->
  <g transform="translate(32, 26) rotate(-10)" filter="url(#musicShadow)">
    <rect x="0" y="0" width="86" height="86" rx="8" fill="#F39C12" stroke="#D35400" stroke-width="2"/>
    <rect x="6" y="6" width="74" height="74" rx="4" fill="#FFEAA7"/>
    <!-- Art on sleeve: music waves & sunflower -->
    <circle cx="43" cy="43" r="16" fill="#FF7675"/>
    <circle cx="43" cy="43" r="7" fill="#FFF275"/>
  </g>

  <!-- Big Vinyl Record sliding out -->
  <g transform="translate(94, 84)" filter="url(#musicShadow)">
    <!-- Vinyl disc with concentric groove rings -->
    <circle cx="0" cy="0" r="50" fill="url(#vinylGrad)" stroke="#636E72" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#636E72" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#636E72" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#636E72" stroke-width="0.8" opacity="0.4"/>

    <!-- Light Sheen reflections -->
    <path d="M-40 -20 Q0 0 -20 -40" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.25"/>
    <path d="M40 20 Q0 0 20 40" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.25"/>

    <!-- Center Label -->
    <circle cx="0" cy="0" r="18" fill="url(#labelGrad)" stroke="#B71540" stroke-width="1.5"/>
    <!-- Spindle hole -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Golden Floating Musical Notes -->
  <g fill="#FFF275" filter="url(#musicShadow)">
    <!-- Double Eighth Note -->
    <g transform="translate(118, 28) scale(0.9)">
      <circle cx="0" cy="14" r="4.5"/>
      <circle cx="14" cy="11" r="4.5"/>
      <rect x="3" y="0" width="2.5" height="15"/>
      <rect x="17" y="-3" width="2.5" height="15"/>
      <polygon points="3,0 19.5,-3 19.5,2 3,5"/>
    </g>
    <!-- Single Note -->
    <g transform="translate(32, 116) scale(0.8)">
      <circle cx="0" cy="10" r="4.5"/>
      <rect x="3" y="-6" width="2.5" height="17"/>
      <path d="M5.5 -6 C10 -6 14 -2 14 4 C14 2 11 -2 5.5 -2 Z"/>
    </g>
  </g>
</svg>
